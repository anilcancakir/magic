# Auto-sync the skills registry when a magic release is published.
#
# Called by publish.yml after its github-release job, so the dispatch happens
# only after pub.dev has accepted the release; or run by hand. It is NOT
# triggered by `release: [published]`: the release is created under the default
# GITHUB_TOKEN, and GitHub starts no workflow run from an event raised by that
# token, so such a trigger never fires. The registry's sync.yml receives the
# repository_dispatch, pulls the skills/magic-framework/ subtree, bumps the
# version triplet, and pushes to master.
#
# Deliberately NOT on every push. A skill edit that lands on master between
# releases waits for the release that carries it, so the registry version
# tracks published packages instead of counting commits. Reach for the manual
# run when a skill fix has to arrive before the next release.
#
# Auth: uses the registry GitHub App (1-hour mint-on-demand
# tokens). Requires REGISTRY_BOT_CLIENT_ID + REGISTRY_BOT_PRIVATE_KEY
# secrets on this repo (same values as on anilcancakir/ai).

name: Dispatch skill update to registry

on:
    workflow_call:
        secrets:
            REGISTRY_BOT_CLIENT_ID:
                required: true
            REGISTRY_BOT_PRIVATE_KEY:
                required: true
    workflow_dispatch:

permissions:
    contents: read

jobs:
    dispatch:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 1
                  persist-credentials: false

            - name: Extract version
              id: ver
              run: |
                  set -euo pipefail
                  if [[ -n "${GITHUB_REF_NAME}" && "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
                      VER="${GITHUB_REF_NAME#v}"
                  else
                      VER=$(grep -E '^version:' pubspec.yaml | head -1 | awk '{print $2}')
                  fi
                  # Strip Dart/Flutter build metadata suffix (e.g. 1.2.3+4 -> 1.2.3)
                  VER="${VER%%+*}"
                  if [[ -z "$VER" ]]; then
                      echo "::error::could not extract a non-empty version from ref or pubspec.yaml"
                      exit 1
                  fi
                  echo "version=$VER" >> "$GITHUB_OUTPUT"

            - name: Mint App token scoped to anilcancakir/ai
              id: app-token
              uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
              with:
                  client-id: ${{ secrets.REGISTRY_BOT_CLIENT_ID }}
                  private-key: ${{ secrets.REGISTRY_BOT_PRIVATE_KEY }}
                  owner: anilcancakir
                  repositories: ai
                  permission-contents: write

            - name: Fire repository_dispatch to anilcancakir/ai
              uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4
              with:
                  token: ${{ steps.app-token.outputs.token }}
                  repository: anilcancakir/ai
                  event-type: skill-updated
                  client-payload: |
                      {
                          "source": "magic",
                          "version": "${{ steps.ver.outputs.version }}",
                          "sha": "${{ github.sha }}"
                      }
